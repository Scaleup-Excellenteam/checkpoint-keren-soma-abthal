<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Check Point Secure Chat</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --card-border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

    #authPage {
      display: flex; justify-content: center; align-items: center; height: 100vh; background: radial-gradient(circle at top, #1e293b 0%, #0b1120 100%);
    }
    .auth-card {
      background: var(--card); border: 1px solid var(--card-border); padding: 36px; border-radius: 12px; width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 16px;
    }
    .auth-card h2 { text-align: center; font-size: 22px; margin-bottom: 8px; }
    .auth-card input {
      background: #0f172a; border: 1px solid var(--card-border); padding: 12px; border-radius: 8px;
      color: var(--text); font-size: 14px; outline: none; width: 100%;
    }
    .auth-card input:focus { border-color: var(--primary); }
    .auth-buttons { display: flex; gap: 10px; margin-top: 6px; }
    .auth-buttons button { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; }
    .btn-login { background: var(--primary); color: white; }
    .btn-login:hover { background: var(--primary-hover); }
    .btn-signup { background: #334155; color: white; }
    .btn-signup:hover { background: #475569; }
    .auth-msg { font-size: 13px; text-align: center; min-height: 20px; }
    .auth-msg.error { color: #f87171; }
    .auth-msg.ok { color: var(--success); }

    #chatPage { display: none; height: 100vh; flex-direction: column; }
    header {
      background: var(--card); border-bottom: 1px solid var(--card-border); padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .user-pill { font-size: 13px; background: #0f172a; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--card-border); }
    .main-body { display: flex; flex: 1; overflow: hidden; }

    aside {
      width: 280px; background: var(--card); border-inline-end: 1px solid var(--card-border);
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .create-box { display: flex; gap: 8px; }
    .create-box input {
      flex: 1; background: #0f172a; border: 1px solid var(--card-border); border-radius: 6px;
      padding: 8px; color: var(--text); outline: none;
    }
    .create-box button {
      background: var(--primary); color: white; border: none; padding: 0 12px; border-radius: 6px; cursor: pointer;
    }
    .room-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .room-item {
      padding: 10px 12px; background: #0f172a; border-radius: 8px; border: 1px solid transparent;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .room-item:hover { border-color: var(--card-border); }
    .room-item.active { border-color: var(--primary); background: rgba(59, 130, 246, 0.15); }
    .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #334155; color: var(--text-dim); }

    main { flex: 1; display: flex; flex-direction: column; background: #0b1120; }
    .chat-header {
      padding: 14px 20px; border-bottom: 1px solid var(--card-border);
      font-weight: 600; display: flex; justify-content: space-between; align-items: center;
    }
    .messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    
    .msg { max-width: 65%; padding: 10px 14px; border-radius: 8px; line-height: 1.4; font-size: 14px; word-break: break-word; }
    .msg.incoming { background: var(--card); align-self: flex-start; }
    .msg.outgoing { background: #1e3a8a; color: #eff6ff; align-self: flex-end; }
    .msg.system { align-self: center; font-size: 12px; color: var(--text-dim); background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px; }
    .msg.system.error { color: #fca5a5; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); }
    .msg-sender { font-size: 11px; color: #93c5fd; margin-bottom: 3px; font-weight: 600; }

    .input-bar {
      padding: 16px 20px; border-top: 1px solid var(--card-border);
      display: flex; gap: 10px; background: var(--card);
    }
    .input-bar input {
      flex: 1; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px;
      padding: 12px; color: var(--text); outline: none; font-size: 14px;
    }
    .input-bar input:focus { border-color: var(--primary); }
    .input-bar button {
      background: var(--primary); border: none; border-radius: 8px; padding: 0 24px;
      color: white; font-weight: 600; cursor: pointer;
    }
    .input-bar button:hover { background: var(--primary-hover); }
  </style>
</head>
<body>

  <!-- מסך התחברות -->
  <div id="authPage">
    <div class="auth-card">
      <h2>Check Point Secure Chat</h2>
      <input type="text" id="username" placeholder="שם משתמש" autocomplete="off">
      <input type="password" id="password" placeholder="סיסמה">
      <div class="auth-buttons">
        <button class="btn-login" onclick="sendAuth('login')">התחבר</button>
        <button class="btn-signup" onclick="sendAuth('signup')">הרשם</button>
      </div>
      <div id="authFeedback" class="auth-msg"></div>
    </div>
  </div>

  <!-- מסך צ'אט -->
  <div id="chatPage">
    <header>
      <div><strong>Check Point Secure Chat</strong></div>
      <div style="display:flex; gap:12px; align-items:center;">
        <span class="user-pill" id="userDisplay">משתמש: ?</span>
        <button onclick="logout()" style="background:#ef4444; border:none; padding:4px 10px; border-radius:6px; color:white; cursor:pointer;">התנתק</button>
      </div>
    </header>

    <div class="main-body">
      <aside>
        <div style="font-size:12px; font-weight:600; color:var(--text-dim); text-transform:uppercase;">יצירת חדר חדש</div>
        <div class="create-box">
          <input type="text" id="newRoomName" placeholder="שם החדר">
          <button onclick="createRoom()">צור</button>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
          <span style="font-size:12px; font-weight:600; color:var(--text-dim); text-transform:uppercase;">חדרים פעילים</span>
          <span style="cursor:pointer; font-size:12px; color:var(--primary);" onclick="loadRooms()">⟳ רענן</span>
        </div>
        <div id="roomList" class="room-list"></div>
      </aside>

      <main>
        <div id="chatHeader" class="chat-header">
          <span id="currentRoomTitle">יש לבחור חדר לשליחת הודעות</span>
        </div>
        <div id="messagesArea" class="messages-area"></div>
        <div class="input-bar">
          <input type="text" id="messageInput" placeholder="בחר חדר תחילה..." onkeydown="if(event.key==='Enter') sendMessage()" disabled>
          <button id="sendBtn" onclick="sendMessage()" disabled>שלח</button>
        </div>
      </main>
    </div>
  </div>

  <script>
    const WS_URL = "ws://172.20.10.2:8765/ws";

    let ws = null;
    let requestId = 1;
    let currentUser = null;
    let activeRoomId = null;
    let pendingJoinRoomId = null;
    let knownRooms = [];

    const roomHistory = {};

    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleServerMessage(data);
        } catch (e) {
          console.error("Failed to parse server message:", e);
        }
      };

      ws.onclose = () => {
        showFeedback("החיבור לשרת נסגר, מנסה להתחבר מחדש...", true);
        setTimeout(connect, 2000);
      };
    }

    function sendRequest(action, payload = {}) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const req = {
        type: "request",
        request_id: String(requestId++),
        action: action,
        payload: payload
      };
      ws.send(JSON.stringify(req));
    }

    function handleServerMessage(data) {
      if (data.type === "response") {
        if (data.status === "error") {
          if (data.code === "ALREADY_ROOM_MEMBER") {
            if (pendingJoinRoomId) {
              const r = knownRooms.find(item => String(item.room_id) === String(pendingJoinRoomId));
              selectRoom(pendingJoinRoomId, r ? r.name : `חדר ${pendingJoinRoomId}`);
              pendingJoinRoomId = null;
            }
            return;
          }
          showFeedback(`[${data.code}] ${data.message || ''}`, true);
          addSystemMessage(`שגיאה: ${data.message || data.code}`, true);
          return;
        }

        switch (data.code) {
          case "SIGNUP_SUCCESS":
            showFeedback("נרשמת בהצלחה! כעת לחצי התחבר", false);
            break;

          case "LOGIN_SUCCESS":
            currentUser = data.payload.username;
            document.getElementById("authPage").style.display = "none";
            document.getElementById("chatPage").style.display = "flex";
            document.getElementById("userDisplay").textContent = `מחובר: ${currentUser}`;
            loadRooms();
            break;

          case "LOGOUT_SUCCESS":
            currentUser = null;
            activeRoomId = null;
            document.getElementById("chatPage").style.display = "none";
            document.getElementById("authPage").style.display = "flex";
            break;

          case "ROOM_CREATED":
          case "ROOM_JOINED":
            pendingJoinRoomId = null;
            selectRoom(String(data.payload.room_id), data.payload.name);
            loadRooms();
            break;

          case "ROOM_LIST":
            knownRooms = data.payload.rooms || [];
            renderRooms(knownRooms);
            break;
        }
      } else if (data.type === "event" && data.event === "room_message") {
        const payload = data.payload;
        const msgRoomId = String(payload.room_id);

        if (!roomHistory[msgRoomId]) {
          roomHistory[msgRoomId] = [];
        }

        roomHistory[msgRoomId].push({
          sender: payload.sender_username,
          text: payload.message,
          isMe: payload.sender_username === currentUser
        });

        if (msgRoomId === String(activeRoomId)) {
          renderCurrentRoomMessages();
        }
      }
    }

    function sendAuth(action) {
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value.trim();
      if (!u || !p) {
        showFeedback("יש להזין שם משתמש וסיסמה", true);
        return;
      }
      sendRequest(action, { username: u, password: p });
    }

    function logout() {
      sendRequest("logout", {});
    }

    function loadRooms() {
      sendRequest("list_rooms", {});
    }

    function createRoom() {
      const input = document.getElementById("newRoomName");
      const name = input.value.trim();
      if (!name) return;
      sendRequest("create_room", { name: name });
      input.value = "";
    }

    function onRoomClicked(roomId, roomName, isMember) {
      const targetId = String(roomId);
      if (isMember) {
        selectRoom(targetId, roomName);
      } else {
        pendingJoinRoomId = targetId;
        sendRequest("join_room", { room_id: targetId });
      }
    }

    function selectRoom(id, name) {
      activeRoomId = String(id);
      document.getElementById("currentRoomTitle").textContent = `חדר פעיל: ${name} (#${id})`;
      enableChat();
      renderRooms(knownRooms);
      renderCurrentRoomMessages();
    }

    function renderCurrentRoomMessages() {
      const area = document.getElementById("messagesArea");
      area.innerHTML = "";

      const history = roomHistory[activeRoomId] || [];
      history.forEach(msg => {
        const div = document.createElement("div");
        div.className = `msg ${msg.isMe ? 'outgoing' : 'incoming'}`;
        div.innerHTML = `<div class="msg-sender">${msg.sender}</div><div>${msg.text}</div>`;
        area.appendChild(div);
      });

      area.scrollTop = area.scrollHeight;
    }

    function enableChat() {
      const input = document.getElementById("messageInput");
      const btn = document.getElementById("sendBtn");
      input.disabled = false;
      btn.disabled = false;
      input.placeholder = "הקלד הודעה...";
      input.focus();
    }

    function renderRooms(rooms) {
      const list = document.getElementById("roomList");
      list.innerHTML = "";
      rooms.forEach(r => {
        const item = document.createElement("div");
        const isActive = String(r.room_id) === String(activeRoomId);
        item.className = `room-item ${isActive ? 'active' : ''}`;
        item.onclick = () => onRoomClicked(r.room_id, r.name, r.member);
        item.innerHTML = `
          <div>
            <div style="font-weight:600; font-size:14px;">${r.name}</div>
            <div style="font-size:11px; color:var(--text-dim)">מזהה: ${r.room_id}</div>
          </div>
          <span class="badge">${r.member ? 'חבר' : 'הצטרף'}</span>
        `;
        list.appendChild(item);
      });
    }

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (!text || !activeRoomId) return;

      sendRequest("send_message", { room_id: String(activeRoomId), message: text });
      input.value = "";
    }

    function addSystemMessage(text, isError = false) {
      const area = document.getElementById("messagesArea");
      const msg = document.createElement("div");
      msg.className = `msg system ${isError ? 'error' : ''}`;
      msg.textContent = text;
      area.appendChild(msg);
      area.scrollTop = area.scrollHeight;
    }

    function showFeedback(text, isError) {
      const fb = document.getElementById("authFeedback");
      fb.className = `auth-msg ${isError ? 'error' : 'ok'}`;
      fb.textContent = text;
    }

    connect();
  </script>
</body>
</html>
